<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التوجيه المهني - أكاديمي vs BTEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card-body {
            padding: 30px;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .question {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #1e3c72;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .option {
            flex: 1;
            min-width: 200px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option:hover {
            border-color: #1e3c72;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option.selected {
            border-color: #27ae60;
            background: #e8f5e9;
        }

        .option-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .option-desc {
            font-size: 12px;
            color: #666;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30,60,114,0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-result {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        .result-card {
            background: #f0f2f5;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        .result-path {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            border-right: 4px solid #27ae60;
        }

        .result-path-title {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .comparison-table th {
            background: #1e3c72;
            color: white;
            padding: 12px;
            text-align: center;
        }

        .comparison-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .comparison-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .btn-reset {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        .test-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .test-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .test-card:hover {
            border-color: #1e3c72;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .test-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .test-title {
            font-size: 20px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .test-desc {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e3c72;
        }

        @media (max-width: 768px) {
            .card-body {
                padding: 20px;
            }
            .option {
                min-width: 100%;
            }
            .options {
                flex-direction: column;
            }
        }
    </style>
</head>

                            <div class="test-card" onclick="startSpecialtyTest()">
                                <div class="test-icon">🎯</div>
                                <div class="test-title">الاختبار الثاني</div>
                                <div class="test-desc">أي تخصص BTEC يناسب ميولك؟<br>(بعد تحديد المسار المهني)</div>
                                <div style="margin-top: 10px; color: #1e3c72; font-size: 12px;">5 أسئلة</div>
                            </div>
                        </div>
                        <div style="margin-top: 30px; padding: 15px; background: #e8f4fd; border-radius: 10px;">
                            <p style="font-size: 14px; color: #1e3c72;">
                            💡 <strong>ملاحظة:</strong> الاختبار الأول يساعدك في تحديد ما إذا كان المسار الأكاديمي (الجامعي) أم المسار المهني (BTEC) أنسب لك بناءً على أسلوب تعلمك واهتماماتك وأهدافك المستقبلية.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTestScreen(testType) {
            const questions = testType === "path" ? pathTestQuestions : specialtyTestQuestions;
            const answers = testType === "path" ? pathAnswers : specialtyAnswers;
            const currentQ = answers[currentQuestionIndex];
            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

            let optionsHtml = "";
            question.options.forEach((opt) => {
                const isSelected = (currentQ === opt.value);
                const selectedClass = isSelected ? "selected" : "";
                optionsHtml += `
                    <div class="option ${selectedClass}" data-value="${opt.value}">
                        <div class="option-title">${opt.title}</div>
                        <div class="option-desc">${opt.desc}</div>
                    </div>
                `;
            });

            const headerTitle = testType === "path" ? "⚖️ الاختبار الأول: أكاديمي أم BTEC؟" : "🎯 الاختبار الثاني: تخصصات BTEC";
            const headerDesc = testType === "path" ? 
                "أجب عن الأسئلة لتحديد ما إذا كان المسار الأكاديمي أو المهني BTEC أنسب لك" : 
                "أجب عن الأسئلة لتحديد أي تخصص BTEC يناسب ميولك";

            return `
                <div class="card">
                    <div class="card-header">
                        <h1>${headerTitle}</h1>
                        <p>${headerDesc}</p>
                    </div>
                    <div class="card-body">
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-text">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                        </div>
                        
                        <div class="question">
                            <div class="question-text">${question.text}</div>
                            <div class="options" id="optionsContainer">
                                ${optionsHtml}
                            </div>
                        </div>
                        
                        <div class="buttons">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.5"' : ''}>السابق</button>
                            <button class="btn btn-primary" onclick="nextQuestion('${testType}')">التالي</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPathResult() {
            let academicCount = 0;
            let btecCount = 0;
            
            pathAnswers.forEach(ans => {
                if (ans === "academic") academicCount++;
                else if (ans === "btec") btecCount++;
            });
            
            const isAcademic = academicCount > btecCount;
            const isBtec = btecCount > academicCount;
            const isBalanced = academicCount === btecCount;
            
            let resultTitle = "";
            let resultDescription = "";
            let recommendation = "";
            let comparisonTable = "";
            
            if (isAcademic) {
                resultTitle = "🎓 المسار الأكاديمي (Academic Path)";
                resultDescription = "بناءً على إجاباتك، يبدو أن المسار الأكاديمي (التعليم الجامعي التقليدي) هو الأنسب لك. أنت تميل إلى التعلم النظري، التفكير التحليلي، وتفضل التقييم بالامتحانات.";
                recommendation = "ننصحك بالتركيز على المواد النظرية، الاستعداد لامتحانات التوجيهي، والتخطيط للالتحاق بالجامعة في تخصص يتناسب مع مهاراتك التحليلية.";
            } else if (isBtec) {
                resultTitle = "🛠️ المسار المهني BTEC (Vocational Path)";
                resultDescription = "بناءً على إجاباتك، يبدو أن المسار المهني BTEC هو الأنسب لك. أنت تميل إلى التعلم التطبيقي، حل المشكلات العملية، وتفضل التقييم بالمشاريع والأعمال المتراكمة.";
                recommendation = "ننصحك بالبحث عن مراكز معتمدة لتقديم برامج BTEC في الأردن، والتواصل مع الكليات التقنية لمعرفة التخصصات المتاحة.";
            } else {
                resultTitle = "⚖️ مسار متوازن (Balanced Path)";
                resultDescription = "بناءً على إجاباتك، أنت تملك مهارات متوازنة بين التعلم النظري والتطبيقي. كلا المسارين قد يناسبك، والخيار يعتمد على أهدافك الشخصية والمهنية.";
                recommendation = "نقترح عليك حضور أيام مفتوحة في كل من الجامعات والكليات التقنية، والتحدث مع طلاب من كلا المسارين لاتخاذ قرار مستنير.";
            }
            
            comparisonTable = `
                <table class="comparison-table">
                    <tr>
                        <th>وجه المقارنة</th>
                        <th>المسار الأكاديمي</th>
                        <th>المسار المهني BTEC</th>
                    </tr>
                    <tr>
                        <td>طريقة التقييم</td>
                        <td>امتحانات نهائية</td>
                        <td>مشاريع وأعمال متراكمة</td>
                    </tr>
                    <tr>
                        <td>أسلوب التعلم</td>
                        <td>نظري، قراءة، بحث</td>
                        <td>تطبيقي، عملي، تجريبي</td>
                    </tr>
                    <tr>
                        <td>المدة الزمنية</td>
                        <td>4-5 سنوات (جامعة)</td>
                        <td>1-3 سنوات (دبلوم/بكالوريوس مهني)</td>
                    </tr>
                    <tr>
                        <td>الوجهة بعد التخرج</td>
                        <td>وظائف تتطلب شهادة جامعية</td>
                        <td>سوق العمل مباشرة أو استكمال دراسات عليا</td>
                    </tr>
                    <tr>
                        <td>التركيز</td>
                        <td>المعرفة النظرية والتحليل</td>
                        <td>المهارات العملية والتطبيق</td>
                    </tr>
                </table>
            `;
            
            return `
                <div class="card">
                    <div class="card-header">
                        <h1>📊 نتيجة الاختبار الأول</h1>
                        <p>${studentName ? `مرحباً ${studentName}` : ""}</p>
                    </div>
                    <div class="card-body">
                        <div class="result-score" style="display: flex; justify-content: center; gap: 40px;">
                            <div style="color: #1e3c72;">🎓 أكاديمي: ${academicCount}/12</div>
                            <div style="color: #27ae60;">🛠️ BTEC: ${btecCount}/12</div>
                        </div>
                        
                        <div class="result-path">
                            <div class="result-path-title">${resultTitle}</div>
                            <div class="result-details">
                                <p>${resultDescription}</p>
                            </div>
                        </div>
                        
                        ${comparisonTable}
                        
                        <div class="result-card">
                            <div class="result-title">💡 التوصية</div>
                            <div class="result-details">
                                <p>${recommendation}</p>
                            </div>
                        </div>
                        
                        ${isBtec || isBalanced ? `
                        <div class="buttons btn-reset">
                            <button class="btn btn-primary" onclick="startSpecialtyTest()">🚀 الانتقال للاختبار الثاني (تخصصات BTEC)</button>
                        </div>
                        ` : `
                        <div class="result-card" style="background: #fff3cd;">
                            <div class="result-details" style="color: #856404;">
                                <p>ℹ️ نظراً لأن ميولك تميل نحو المسار الأكاديمي، قد لا تحتاج إلى الاختبار الثاني المخصص لتخصصات BTEC. لكن يمكنك تجربته للاطلاع فقط.</p>
                            </div>
                            <div class="buttons" style="margin-top: 15px;">
                                <button class="btn btn-primary" onclick="startSpecialtyTest()">📖 تجربة الاختبار الثاني للاطلاع</button>
                                <button class="btn btn-secondary" onclick="resetAndGoHome()">🏠 العودة للصفحة الرئيسية</button>
                            </div>
                        </div>
                        `}
                        
                        ${!isBtec && !isBalanced ? `
                        <div class="buttons btn-reset" style="margin-top: 15px;">
                            <button class="btn btn-secondary" onclick="resetAndGoHome()">🏠 العودة للصفحة الرئيسية</button>
                        </div>
                        ` : ""}
                    </div>
                </div>
            `;
        }

        function renderSpecialtyResult() {
            const counts = {
                engineering: 0,
                health: 0,
                it: 0,
                business: 0,
                sports_arts: 0
            };
            
            specialtyAnswers.forEach(ans => {
                if (ans && counts[ans] !== undefined) counts[ans]++;
            });
            
            let maxSpecialty = null;
            let maxCount = 0;
            for (const [specialty, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    maxSpecialty = specialty;
                }
            }
            
            const info = specialtyInfo[maxSpecialty];
            const totalQuestions = specialtyAnswers.length;
            
            let distributionHtml = "";
            for (const [specialty, count] of Object.entries(counts)) {
                const percent = (count / totalQuestions) * 100;
                distributionHtml += `
                    <div class="specialty-bar" style="margin: 10px 0;">
                        <span style="display: inline-block; width: 140px; font-weight: bold;">${specialtyInfo[specialty].name.split(" ")[0]}</span>
                        <div style="display: inline-block; width: 60%; background: #e0e0e0; border-radius: 10px; overflow: hidden; vertical-align: middle;">
                            <div style="width: ${percent}%; height: 20px; background: ${specialtyInfo[specialty].color};"></div>
                        </div>
                        <span style="margin-right: 10px;">${count}/${totalQuestions}</span>
                    </div>
                `;
            }
            
            return `
                <div class="card">
                    <div class="card-header">
                        <h1>🎓 نتيجة الاختبار الثاني</h1>
                        <p>${studentName ? `مرحباً ${studentName}` : ""}</p>
                    </div>
                    <div class="card-body">
                        <div class="result-path">
                            <div class="result-path-title">🏆 التخصص المناسب لك ضمن BTEC: ${info.name}</div>
                            <div class="result-details">
                                <p><strong>📖 الوصف:</strong> ${info.description}</p>
                                <p><strong>💼 مجالات العمل:</strong> ${info.careers}</p>
                                <p><strong>📚 المواد الرئيسية:</strong> ${info.subjects}</p>
                            </div>
                        </div>
                        
                        <div class="result-card">
                            <div class="result-title" style="font-size: 18px;">📊 توزيع اهتماماتك</div>
                            ${distributionHtml}
                        </div>
                        
                        <div class="result-card">
                            <div class="result-title">💡 الخطوات التالية</div>
                            <div class="result-details">
                                <ul style="margin-right: 20px; line-height: 1.8;">
                                    <li>🔍 ابحث عن مراكز معتمدة من بيرسون (Pearson) في الأردن تقدم تخصص ${info.name}</li>
                                    <li>📞 تواصل مع الكليات التقنية مثل كلية المجتمع العربي، كلية عمان الأهلية</li>
                                    <li>🏫 احضر أيام الأبواب المفتوحة للتعرف على البرامج المتاحة</li>
                                    <li>📧 تواصل مع السفارة البريطانية في عمان للاستفسار عن البرامج المعتمدة</li>
                                    <li>💻 قم بزيارة موقع بيرسون الرسمي: qualifications.pearson.com</li>
                                </ul>
                            </div>
                        </div>
                        
                        <div class="buttons btn-reset" style="display: flex; gap: 15px;">
                            <button class="btn btn-primary" onclick="resetAndGoHome()">🏠 العودة للصفحة الرئيسية</button>
                            <button class="btn btn-secondary" onclick="startPathTest()">🔄 إعادة الاختبار الأول</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ========================
        // دوال التحكم
        // ========================
        window.startPathTest = function() {
            const nameInput = document.getElementById("studentName");
            if (nameInput) studentName = nameInput.value;
            pathAnswers = new Array(pathTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            currentScreen = "pathTest";
            render();
        };

        window.startSpecialtyTest = function() {
            const nameInput = document.getElementById("studentName");
            if (nameInput) studentName = nameInput.value;
            specialtyAnswers = new Array(specialtyTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            currentScreen = "specialtyTest";
            render();
        };

        window.previousQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                render();
            }
        };

        window.nextQuestion = function(testType) {
            const answers = testType === "path" ? pathAnswers : specialtyAnswers;
            if (answers[currentQuestionIndex] === null) {
                alert("الرجاء اختيار إجابة قبل المتابعة");
                return;
            }
            
            if (currentQuestionIndex + 1 < answers.length) {
                currentQuestionIndex++;
                render();
            } else {
                if (testType === "path") {
                    currentScreen = "pathResult";
                } else {
                    currentScreen = "specialtyResult";
                }
                render();
            }
        };

        window.resetAndGoHome = function() {
            currentScreen = "main";
            pathAnswers = new Array(pathTestQuestions.length).fill(null);
            specialtyAnswers = new Array(specialtyTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            render();
        };

        function attachEventListeners() {
            const optionsContainer = document.getElementById("optionsContainer");
            if (optionsContainer) {
                const options = optionsContainer.querySelectorAll(".option");
                options.forEach(opt => {
                    opt.removeEventListener("click", handleOptionClick);
                    opt.addEventListener("click", handleOptionClick);
                });
            }
        }

        function handleOptionClick(e) {
            const option = e.currentTarget;
            const value = option.dataset.value;
            const testType = currentScreen === "pathTest" ? "path" : "specialty";
            
            if (testType === "path") {
                pathAnswers[currentQuestionIndex] = value;
            } else {
                specialtyAnswers[currentQuestionIndex] = value;
            }
            
            const container = document.getElementById("optionsContainer");
            if (container) {
                const allOptions = container.querySelectorAll(".option");
                allOptions.forEach(opt => {
                    opt.classList.remove("selected");
                });
                option.classList.add("selected");
            }
        }

        render();
    </script>
</body>
</html>
