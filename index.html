<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التوجيه المهني - BTEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* البطاقة الرئيسية */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card-body {
            padding: 30px;
        }

        /* شريط التقدم */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        /* السؤال الواحد */
        .question {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #667eea;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .option {
            flex: 1;
            min-width: 200px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .option.selected {
            border-color: #27ae60;
            background: #e8f5e9;
        }

        .option-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .option-desc {
            font-size: 12px;
            color: #666;
        }

        /* الأزرار */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
        }

        /* نتائج الاختبار */
        .result-card {
            background: #f0f2f5;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .result-path {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            border-right: 4px solid #27ae60;
        }

        .result-path-title {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 10px;
        }

        .result-details {
            line-height: 1.8;
            color: #555;
        }

        .specialty-distribution {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .specialty-bar {
            margin: 10px 0;
        }

        .specialty-label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        .bar {
            display: inline-block;
            height: 20px;
            background: #667eea;
            border-radius: 10px;
            vertical-align: middle;
        }

        .btn-reset {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        /* الشاشة الأولى (الاختيار بين الاختبارين) */
        .test-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .test-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .test-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .test-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .test-title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .test-desc {
            color: #666;
            font-size: 14px;
        }

        /* الحقول النصية */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* التنبيهات */
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* الهيدر */
        .header-logo {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .card-body {
                padding: 20px;
            }
            .option {
                min-width: 100%;
            }
            .options {
                flex-direction: column;
            }
        }
    </style>
</head>

                name: "الهندسة (Engineering)",
                description: "تخصص الهندسة يركز على تصميم وتحليل وتطوير الأنظمة الميكانيكية والكهربائية والمدنية. ستدرس مواضيع مثل الرياضيات التطبيقية، الفيزياء، الرسم الهندسي، وعلوم المواد.",
                careers: "مهندس ميكانيكي، مهندس كهربائي، فني صيانة، مهندس إنتاج، مهندس مدني",
                subjects: "الرياضيات التطبيقية، الفيزياء، الرسم الهندسي، ميكانيكا الموائع، الديناميكا الحرارية، علوم المواد",
                color: "#3498db"
            },
            health: {
                name: "الصحة والرعاية الاجتماعية (Health & Social Care)",
                description: "يركز هذا التخصص على فهم صحة الإنسان وتقديم الرعاية المناسبة. ستدرس مواضيع مثل التشريح، علم النفس، التغذية، وأخلاقيات الرعاية الصحية.",
                careers: "ممرض، أخصائي رعاية صحية، أخصائي تغذية، مسعف، عامل في دور الرعاية",
                subjects: "التشريح وعلم وظائف الأعضاء، علم النفس، التغذية، أخلاقيات الرعاية الصحية، الإسعافات الأولية",
                color: "#e74c3c"
            },
            it: {
                name: "تكنولوجيا المعلومات (IT / Computing)",
                description: "تخصص تقني يركز على البرمجة وتحليل الأنظمة وتطوير البرمجيات. ستدرس مواضيع مثل أساسيات البرمجة، قواعد البيانات، الشبكات، وأمن المعلومات.",
                careers: "مبرمج، مطور ويب، محلل أنظمة، أخصائي شبكات، أخصائي أمن سيبراني",
                subjects: "أساسيات البرمجة، قواعد البيانات، الشبكات، أمن المعلومات، تحليل الأنظمة، تطوير التطبيقات",
                color: "#2ecc71"
            },
            business: {
                name: "الأعمال (Business)",
                description: "تخصص يركز على إدارة المؤسسات وفهم السوق والتسويق. ستدرس مواضيع مثل مبادئ الإدارة، المحاسبة، التسويق، والاقتصاد.",
                careers: "مدير أعمال، مسوق، محاسب، رائد أعمال، محلل مالي، مدير موارد بشرية",
                subjects: "مبادئ الإدارة، المحاسبة، التسويق، الاقتصاد، السلوك التنظيمي، ريادة الأعمال",
                color: "#f39c12"
            },
            sports_arts: {
                name: "الرياضة أو الفنون والإعلام (Sport / Arts & Media)",
                description: "تخصص مزدوج يشمل مجالات الرياضة (علوم الرياضة، التدريب الرياضي) والفنون والإعلام (التصميم، الإعلام، الموسيقى). ستدرس مواضيع حسب المسار الذي تختاره.",
                careers: "مدرب رياضي، أخصائي لياقة بدنية، مصمم جرافيك، منتج إعلامي، صحفي، مصور فوتوغرافي",
                subjects: "حسب المسار: علوم الرياضة والتدريب، أو التصميم والإعلام والتواصل",
                color: "#9b59b6"
            }
        };

        // ========================
        // متغيرات التطبيق
        // ========================
        let currentScreen = "main"; // main, pathTest, specialtyTest
        let pathAnswers = new Array(pathTestQuestions.length).fill(null);
        let specialtyAnswers = new Array(specialtyTestQuestions.length).fill(null);
        let currentQuestionIndex = 0;
        let studentName = "";

        // ========================
        // وظائف مساعدة
        // ========================
        function render() {
            const app = document.getElementById("app");
            if (currentScreen === "main") {
                app.innerHTML = renderMainScreen();
            } else if (currentScreen === "pathTest") {
                app.innerHTML = renderTestScreen("path");
            } else if (currentScreen === "specialtyTest") {
                app.innerHTML = renderTestScreen("specialty");
            } else if (currentScreen === "pathResult") {
                app.innerHTML = renderPathResult();
            } else if (currentScreen === "specialtyResult") {
                app.innerHTML = renderSpecialtyResult();
            }
            attachEventListeners();
        }

        function renderMainScreen() {
            return `
                <div class="card">
                    <div class="card-header">
                        <h1>🎓 نظام التوجيه المهني - BTEC</h1>
                        <p>اكتشف المسار والتخصص المناسب لك</p>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>👤 أدخل اسمك (اختياري):</label>
                            <input type="text" id="studentName" placeholder="مثال: أحمد محمد" value="${studentName}">
                        </div>
                        <div class="test-selector">
                            <div class="test-card" onclick="startPathTest()">
                                <div class="test-icon">🧭</div>
                                <div class="test-title">الاختبار الأول</div>
                                <div class="test-desc">تحديد المسار المناسب (تقني أم مهني)</div>
                                <div style="margin-top: 15px; color: #667eea; font-size: 12px;">≈ 12 سؤال</div>
                            </div>
                            <div class="test-card" onclick="startSpecialtyTest()">
                                <div class="test-icon">🎯</div>
                                <div class="test-title">الاختبار الثاني</div>
                                <div class="test-desc">تحديد التخصص المناسب ضمن BTEC</div>
                                <div style="margin-top: 15px; color: #667eea; font-size: 12px;">≈ 10 أسئلة</div>
                            </div>
                        </div>
                        <div class="header-logo">
                            <p>نظام التوجيه المهني - BTEC | مستند إلى معايير بيرسون</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTestScreen(testType) {
            const questions = testType === "path" ? pathTestQuestions : specialtyTestQuestions;
            const answers = testType === "path" ? pathAnswers : specialtyAnswers;
            const currentQ = answers[currentQuestionIndex] !== null ? answers[currentQuestionIndex] : null;
            const question = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

            let optionsHtml = "";
            question.options.forEach((opt, idx) => {
                const isSelected = (currentQ === opt.value || (testType === "path" && currentQ === opt.value));
                const selectedClass = isSelected ? "selected" : "";
                optionsHtml += `
                    <div class="option ${selectedClass}" data-value="${opt.value}">
                        <div class="option-title">${opt.title}</div>
                        <div class="option-desc">${opt.desc}</div>
                    </div>
                `;
            });

            return `
                <div class="card">
                    <div class="card-header">
                        <h1>${testType === "path" ? "🧭 الاختبار الأول: تحديد المسار" : "🎯 الاختبار الثاني: تحديد التخصص"}</h1>
                        <p>${testType === "path" ? "أجب عن الأسئلة لتحديد المسار المناسب لك (تقني أو مهني)" : "أجب عن الأسئلة لتحديد التخصص المناسب ضمن BTEC"}</p>
                    </div>
                    <div class="card-body">
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-text">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                        </div>
                        
                        <div class="question">
                            <div class="question-text">${question.text}</div>
                            <div class="options" id="optionsContainer">
                                ${optionsHtml}
                            </div>
                        </div>
                        
                        <div class="buttons">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled style="opacity:0.5"' : ''}>السابق</button>
                            <button class="btn btn-primary" onclick="nextQuestion('${testType}')">التالي</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPathResult() {
            let totalScore = 0;
            pathAnswers.forEach(ans => {
                if (ans === 1) totalScore += 1;
                else if (ans === 2) totalScore += 2;
            });
            
            const isTechnical = totalScore <= 16; // 12-16 نقطة = تقني، 17-24 = مهني
            const pathName = isTechnical ? "المسار التقني (BTEC Nationals)" : "المسار المهني (BTEC Technicals)";
            const pathDesc = isTechnical ? 
                "يركز على المعرفة الأكاديمية والتطبيق معاً. مناسب لمن يخطط للالتحاق بالجامعة. يعادل في مستواه A-Levels." :
                "يركز على المهارات العملية التي يحتاجها سوق العمل. مصمم بالتعاون مع أرباب العمل. مناسب لمن يرغب بالعمل مباشرة بعد التخرج.";
            
            const examples = isTechnical ?
                "العلوم التطبيقية، تكنولوجيا المعلومات، الهندسة، الصحة والرعاية الاجتماعية" :
                "المدرب الشخصي (هو التخصص الوحيد المعتمد لعمر 16-19 حالياً)";

            return `
                <div class="card">
                    <div class="card-header">
                        <h1>📊 نتيجة الاختبار الأول</h1>
                        <p>${studentName ? `مرحباً ${studentName}` : ""}</p>
                    </div>
                    <div class="card-body">
                        <div class="result-score">
                            ${totalScore} / 24
                        </div>
                        
                        <div class="result-path">
                            <div class="result-path-title">🎯 ${pathName}</div>
                            <div class="result-details">
                                <p><strong>📖 الوصف:</strong> ${pathDesc}</p>
                                <p><strong>📚 أمثلة على التخصصات:</strong> ${examples}</p>
                            </div>
                        </div>
                        
                        <div class="result-card">
                            <div class="result-title">💡 التوصية</div>
                            <div class="result-details">
                                <p>${isTechnical ? 
                                    "أنت تميل للتعلم النظري والتفكير التحليلي. ننصحك بالتركيز على المواد الأكاديمية والتخطيط للالتحاق بالجامعة. يمكنك الآن الانتقال إلى الاختبار الثاني لتحديد التخصص المناسب ضمن هذا المسار." : 
                                    "أنت تميل للتعلم التطبيقي وحل المشكلات العملي. ننصحك بالبحث عن فرص التدريب المهني والتواصل مع الشركات. يمكنك الآن الانتقال إلى الاختبار الثاني لتحديد التخصص المناسب ضمن هذا المسار."}
                                </p>
                            </div>
                        </div>
                        
                        <div class="buttons btn-reset">
                            <button class="btn btn-primary" onclick="startSpecialtyTest()">🚀 الانتقال للاختبار الثاني</button>
                            <button class="btn btn-secondary" onclick="resetAndGoHome()">🏠 العودة للصفحة الرئيسية</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSpecialtyResult() {
            const counts = {
                engineering: 0,
                health: 0,
                it: 0,
                business: 0,
                sports_arts: 0
            };
            
            specialtyAnswers.forEach(ans => {
                if (ans && counts[ans] !== undefined) counts[ans]++;
            });
            
            let maxSpecialty = null;
            let maxCount = 0;
            for (const [specialty, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    maxSpecialty = specialty;
                }
            }
            
            const info = specialtyInfo[maxSpecialty];
            const totalQuestions = specialtyAnswers.length;
            
            let distributionHtml = "";
            for (const [specialty, count] of Object.entries(counts)) {
                const percent = (count / totalQuestions) * 100;
                distributionHtml += `
                    <div class="specialty-bar">
                        <span class="specialty-label">${specialtyInfo[specialty].name.split(" ")[0]}</span>
                        <div class="bar" style="width: ${percent}%; background: ${specialtyInfo[specialty].color}"></div>
                        <span style="margin-right: 10px;">${count} / ${totalQuestions}</span>
                    </div>
                `;
            }
            
            return `
                <div class="card">
                    <div class="card-header">
                        <h1>🎓 نتيجة الاختبار الثاني</h1>
                        <p>${studentName ? `مرحباً ${studentName}` : ""}</p>
                    </div>
                    <div class="card-body">
                        <div class="result-path">
                            <div class="result-path-title">🏆 التخصص المناسب لك: ${info.name}</div>
                            <div class="result-details">
                                <p><strong>📖 الوصف:</strong> ${info.description}</p>
                                <p><strong>💼 مجالات العمل:</strong> ${info.careers}</p>
                                <p><strong>📚 المواد الرئيسية:</strong> ${info.subjects}</p>
                            </div>
                        </div>
                        
                        <div class="specialty-distribution">
                            <div class="result-title" style="font-size: 18px;">📊 توزيع اهتماماتك</div>
                            ${distributionHtml}
                        </div>
                        
                        <div class="result-card">
                            <div class="result-title">💡 الخطوات التالية</div>
                            <div class="result-details">
                                <ul style="margin-right: 20px;">
                                    <li>🔍 ابحث عن مؤسسات تعليمية في الأردن تقدم تخصص ${info.name}</li>
                                    <li>📞 تواصل مع طلاب أو خريجين لمعرفة تجربتهم</li>
                                    <li>🏫 احضر أيام الأبواب المفتوحة في الكليات المتخصصة</li>
                                    <li>📧 تواصل مع السفارة البريطانية في عمان للاستفسار عن البرامج المعتمدة</li>
                                </ul>
                            </div>
                        </div>
                        
                        <div class="buttons btn-reset">
                            <button class="btn btn-primary" onclick="resetAndGoHome()">🏠 العودة للصفحة الرئيسية</button>
                            <button class="btn btn-secondary" onclick="startPathTest()">🔄 إعادة الاختبار الأول</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ========================
        // وظائف التحكم
        // ========================
        window.startPathTest = function() {
            const nameInput = document.getElementById("studentName");
            if (nameInput) studentName = nameInput.value;
            pathAnswers = new Array(pathTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            currentScreen = "pathTest";
            render();
        };

        window.startSpecialtyTest = function() {
            const nameInput = document.getElementById("studentName");
            if (nameInput) studentName = nameInput.value;
            specialtyAnswers = new Array(specialtyTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            currentScreen = "specialtyTest";
            render();
        };

        window.previousQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                render();
            }
        };

        window.nextQuestion = function(testType) {
            const answers = testType === "path" ? pathAnswers : specialtyAnswers;
            if (answers[currentQuestionIndex] === null) {
                alert("الرجاء اختيار إجابة قبل المتابعة");
                return;
            }
            
            if (currentQuestionIndex + 1 < answers.length) {
                currentQuestionIndex++;
                render();
            } else {
                // نهاية الاختبار
                if (testType === "path") {
                    currentScreen = "pathResult";
                } else {
                    currentScreen = "specialtyResult";
                }
                render();
            }
        };

        window.resetAndGoHome = function() {
            currentScreen = "main";
            pathAnswers = new Array(pathTestQuestions.length).fill(null);
            specialtyAnswers = new Array(specialtyTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            render();
        };

        function attachEventListeners() {
            const optionsContainer = document.getElementById("optionsContainer");
            if (optionsContainer) {
                const options = optionsContainer.querySelectorAll(".option");
                options.forEach(opt => {
                    opt.removeEventListener("click", handleOptionClick);
                    opt.addEventListener("click", handleOptionClick);
                });
            }
        }

        function handleOptionClick(e) {
            const option = e.currentTarget;
            const value = option.dataset.value;
            const testType = currentScreen === "pathTest" ? "path" : "specialty";
            
            if (testType === "path") {
                pathAnswers[currentQuestionIndex] = parseInt(value);
            } else {
                specialtyAnswers[currentQuestionIndex] = value;
            }
            
            // تحديث واجهة الاختيارات
            const container = document.getElementById("optionsContainer");
            if (container) {
                const allOptions = container.querySelectorAll(".option");
                allOptions.forEach(opt => {
                    opt.classList.remove("selected");
                });
                option.classList.add("selected");
            }
        }

        // بدء التطبيق
        render();
    </script>
</body>
</html>
